  // ==================================================
  // クラウド同期(Cloudflare Workers + D1 + R2)
  // uuidとupdatedAtを見て、新しい方を残す双方向マージ。ZIPバックアップと同じ考え方。
  // ==================================================
  const SYNC_API_URL = 'https://chordwiki-live-viewer.kento-kawamura-730.workers.dev';
  const SYNC_KEY_STORAGE = 'cwlv_sync_key';

  // URLに ?key=... が付いていたら自動保存する。
  // 新しい端末でキーを手入力しなくて済むよう、このURLをLINE/メモ等で自分に送って
  // タップするだけでセットアップできるようにするため。
  // あえてURLからは消さない: 「ホーム画面に追加」はその時点のアドレスバーのURLを
  // そのままブックマークするため、ここで消してしまうと後から追加した時にキーが
  // 失われてしまう(実際に発生した不具合)。
  (() => {
    const params = new URLSearchParams(location.search);
    const keyFromUrl = params.get('key');
    if (keyFromUrl) {
      localStorage.setItem(SYNC_KEY_STORAGE, keyFromUrl);
    }
  })();

  function getSyncKey() {
    let key = localStorage.getItem(SYNC_KEY_STORAGE);
    if (!key) {
      key = prompt('同期キーを入力してください');
      if (key) localStorage.setItem(SYNC_KEY_STORAGE, key);
    }
    return key || null;
  }

  // memo画像はJSON(D1のTEXTカラム)に載せて送るためbase64にする
  function arrayBufferToBase64(buf) {
    let binary = '';
    const bytes = new Uint8Array(buf);
    const chunkSize = 0x8000;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  }
  function base64ToArrayBuffer(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  // 種別(text/image/stroke)を問わずフィールドをそのまま引き継ぎ、画像のバイナリ本体だけ
  // base64に変換する(D1のJSONカラムに載せるため)。
  function serializeMemosForUpload(memos) {
    return (memos || []).map((m) => {
      if (m.type === 'image' && m.data) {
        const { data, ...rest } = m;
        return { ...rest, data: arrayBufferToBase64(data) };
      }
      return m;
    });
  }
  function deserializeMemosFromRemote(memos) {
    return (memos || []).map((m) => {
      if (m.type === 'image' && m.data) {
        return { ...m, data: base64ToArrayBuffer(m.data) };
      }
      return m;
    });
  }

  async function uploadSong(key, song) {
    const form = new FormData();
    form.set('name', song.name);
    form.set('fileName', song.fileName);
    form.set('mimeType', song.mimeType);
    form.set('speed', String(song.speed));
    form.set('bpm', song.bpm != null ? String(song.bpm) : '');
    form.set('youtubeUrl', song.youtubeUrl || '');
    form.set('memos', JSON.stringify(serializeMemosForUpload(song.memos)));
    form.set('createdAt', String(song.createdAt));
    form.set('updatedAt', String(song.updatedAt));
    const buf = await getSongArrayBuffer(song);
    form.set('file', new Blob([buf], { type: song.mimeType }), song.fileName);
    const res = await fetch(`${SYNC_API_URL}/api/songs/${song.uuid}`, {
      method: 'PUT', headers: { 'X-Sync-Key': key }, body: form,
    });
    if (!res.ok) throw new Error(`アップロード失敗: ${song.name} (${res.status})`);
  }

  async function downloadSong(key, remote, existingLocal) {
    const res = await fetch(`${SYNC_API_URL}/api/songs/${remote.uuid}/file`, {
      headers: { 'X-Sync-Key': key },
    });
    if (!res.ok) throw new Error(`ダウンロード失敗: ${remote.name} (${res.status})`);
    const data = await res.arrayBuffer();
    const memos = deserializeMemosFromRemote(remote.memos);
    if (existingLocal) {
      Object.assign(existingLocal, {
        name: remote.name, bpm: remote.bpm, speed: remote.speed,
        data, fileName: remote.fileName, mimeType: remote.mimeType,
        youtubeUrl: remote.youtubeUrl || null,
        memos, updatedAt: remote.updatedAt,
      });
      await dbPut(existingLocal);
    } else {
      await dbAdd({
        uuid: remote.uuid, name: remote.name, bpm: remote.bpm, speed: remote.speed,
        data, fileName: remote.fileName, mimeType: remote.mimeType, memos,
        youtubeUrl: remote.youtubeUrl || null,
        createdAt: remote.createdAt, updatedAt: remote.updatedAt,
      });
    }
  }

  async function syncNow() {
    const key = getSyncKey();
    if (!key) return;

    const res = await fetch(`${SYNC_API_URL}/api/songs`, { headers: { 'X-Sync-Key': key } });
    if (res.status === 401) {
      localStorage.removeItem(SYNC_KEY_STORAGE);
      throw new Error('同期キーが正しくありません(再度お試しください)');
    }
    if (!res.ok) throw new Error(`サーバーエラー (${res.status})`);
    const remoteSongs = await res.json();
    const remoteByUuid = new Map(remoteSongs.map((s) => [s.uuid, s]));

    const localSongs = await dbGetAll();
    await Promise.all(localSongs.map(ensureSongUuid));
    const localByUuid = new Map(localSongs.map((s) => [s.uuid, s]));

    let uploaded = 0, downloaded = 0;

    for (const song of localSongs) {
      const remote = remoteByUuid.get(song.uuid);
      if (!remote || song.updatedAt > remote.updatedAt) {
        await uploadSong(key, song);
        uploaded++;
      }
    }
    for (const remote of remoteSongs) {
      const local = localByUuid.get(remote.uuid);
      if (!local || remote.updatedAt > local.updatedAt) {
        await downloadSong(key, remote, local);
        downloaded++;
      }
    }

    const setlistRes = await fetch(`${SYNC_API_URL}/api/setlists`, { headers: { 'X-Sync-Key': key } });
    if (!setlistRes.ok) throw new Error(`サーバーエラー(セットリスト) (${setlistRes.status})`);
    const remoteSetlists = await setlistRes.json();
    const remoteSetlistByUuid = new Map(remoteSetlists.map((s) => [s.uuid, s]));

    const localSetlists = await slGetAll();
    await Promise.all(localSetlists.map(ensureSetlistUuid));
    const localSetlistByUuid = new Map(localSetlists.map((s) => [s.uuid, s]));

    for (const sl of localSetlists) {
      const remote = remoteSetlistByUuid.get(sl.uuid);
      if (!remote || sl.updatedAt > remote.updatedAt) {
        await uploadSetlist(key, sl);
        uploaded++;
      }
    }
    for (const remote of remoteSetlists) {
      const local = localSetlistByUuid.get(remote.uuid);
      if (!local || remote.updatedAt > local.updatedAt) {
        await downloadSetlist(remote, local);
        downloaded++;
      }
    }

    alert(`同期完了: アップロード${uploaded}件 / ダウンロード${downloaded}件`);
    renderSongList();
    renderSetlistList();
  }

  async function uploadSetlist(key, setlist) {
    const res = await fetch(`${SYNC_API_URL}/api/setlists/${setlist.uuid}`, {
      method: 'PUT',
      headers: { 'X-Sync-Key': key, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: setlist.name,
        items: setlist.items || [],
        createdAt: setlist.createdAt,
        updatedAt: setlist.updatedAt,
      }),
    });
    if (!res.ok) throw new Error(`アップロード失敗(セットリスト): ${setlist.name} (${res.status})`);
  }

  async function downloadSetlist(remote, existingLocal) {
    if (existingLocal) {
      Object.assign(existingLocal, {
        name: remote.name, items: remote.items, updatedAt: remote.updatedAt,
      });
      await slPut(existingLocal);
    } else {
      await slAdd({
        uuid: remote.uuid, name: remote.name, items: remote.items,
        createdAt: remote.createdAt, updatedAt: remote.updatedAt,
      });
    }
  }

  async function addNewSong(file) {
    if (!isPdfFile(file) && !isImageFile(file)) {
      alert('画像またはPDFファイルを選択してください');
      return;
    }
    const defaultName = file.name.replace(/\.[^.]+$/, '');
    const name = prompt('曲名を入力してください', defaultName);
    if (name === null) return; // キャンセル
    const bpmStr = prompt('BPM(任意、空欄可)', '');
    if (bpmStr === null) return;
    const bpm = bpmStr.trim() ? parseInt(bpmStr, 10) : null;

    const song = {
      uuid: crypto.randomUUID(),
      name: name.trim() || defaultName,
      data: await file.arrayBuffer(),
      mimeType: file.type || (isPdfFile(file) ? 'application/pdf' : 'image/png'),
      fileName: file.name,
      speed: DEFAULT_SPEED,
      bpm: Number.isFinite(bpm) ? bpm : null,
      memos: [],
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };
    const id = await dbAdd(song);
    song.id = id;
    activeSetlist = null;
    activeSetlistIndex = -1;
    viewerReturnScreen = songListScreen;
    viewer.classList.remove('setlist-active');
    await openSongRecord(song);

  async function loadIntoViewer(file) {
    const isPdf = isPdfFile(file);
    // タイル生成時にscrollWrapのclientWidth/Heightを使うため、
    // 計測前にビューア画面を表示してレイアウトを確定させる(#viewerはdisplay:noneだと0になる)。
    showScreen(viewer);
    try {
      if (isPdf) await loadPdfFile(file);
      else await loadImageFile(file);
      if (contentHeight <= 0) {
        throw new Error('コンテンツの高さが0でした(読み込んだファイルが空か、非対応の形式の可能性があります)');
      }
      renderMemos();
    } catch (err) {

      alert('読み込みエラー: ' + (err && err.message ? err.message : err));
      showScreen(viewerReturnScreen || songListScreen);
    }

  function loadImageFile(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        currentSourceKind = 'image';
        currentImageEl = img;
        currentPdfDoc = null;
        buildTilesFromImage(img).then(resolve);
        URL.revokeObjectURL(url);
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  let pdfJsLoadPromise = null;
  function loadPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if (pdfJsLoadPromise) return pdfJsLoadPromise;
    // オフライン起動用にリポジトリ同梱のpdf.jsを動的importする(CDN依存なし)。
    pdfJsLoadPromise = import('./vendor/pdfjs/pdf.min.js')
      .then((pdfjsLib) => {
        pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdfjs/pdf.worker.min.js';
        window.pdfjsLib = pdfjsLib;
        return pdfjsLib;
      });
    return pdfJsLoadPromise;
  }

  async function loadPdfFile(file) {
    const pdfjsLib = await loadPdfJs();
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    currentSourceKind = 'pdf';
    currentPdfDoc = pdf;
    currentImageEl = null;
    await buildTilesFromPdf(pdf);
  }

    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (currentSourceKind) rebuildCurrentSource();
    }, 200);
  });

  applyAppMode();
  renderSongList();
})();
</script>
</body>
</html>
