<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ChordWiki Live Viewer (Prototype)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #111; color: #eee; font-family: system-ui, sans-serif;
    overscroll-behavior: none;
  }
  #app { position: fixed; inset: 0; }

  /* --- 曲一覧画面 --- */
  #songListScreen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    padding: 20px; padding-top: max(20px, env(safe-area-inset-top));
    overflow-y: auto;
  }
  #songListScreen.hidden { display: none; }
  #songListHeader {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  #songListHeader h1 { font-size: 18px; margin: 0; }
  #btnAddSong {
    font-size: 15px; padding: 10px 16px; border-radius: 8px; border: none;
    background: #6cf; color: #111; font-weight: bold; cursor: pointer;
  }
  #fileInput, #zipInput { display: none; }

  #backupBar {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    font-size: 12px; color: #999;
  }
  #backupBar button {
    font-size: 12px; padding: 6px 10px; border-radius: 6px; border: none;
    background: #333; color: #eee; cursor: pointer;
  }
  #lastBackupInfo.warn { color: #f77; }

  #songList { display: flex; flex-direction: column; gap: 10px; }
  #songList .empty { color: #999; font-size: 14px; text-align: center; margin-top: 40px; }
  .songRow {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px;
    background: #1c1c1c; border-radius: 10px;
  }
  .songMain { flex: 1; min-width: 0; cursor: pointer; }
  .songName { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .songMeta { font-size: 12px; color: #999; margin-top: 2px; }
  .songRow button {
    font-size: 13px; padding: 8px 10px; border-radius: 6px; border: none;
    background: #333; color: #eee; cursor: pointer; flex-shrink: 0;
  }

  /* --- セットリスト一覧・編集・曲ピッカー画面(曲一覧画面と共通の見た目) --- */
  #setlistListScreen, #setlistEditScreen, #songPickerScreen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    padding: 20px; padding-top: max(20px, env(safe-area-inset-top));
    overflow-y: auto;
  }
  #setlistListScreen.hidden, #setlistEditScreen.hidden, #songPickerScreen.hidden { display: none; }
  #setlistListHeader, #setlistEditHeader, #songPickerHeader {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  }
  #setlistListHeader h1, #setlistEditHeader h1, #songPickerHeader h1 {
    font-size: 18px; margin: 0; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #setlistListHeader button, #setlistEditHeader button, #songPickerHeader button,
  #setlistEditFooter button {
    font-size: 14px; padding: 9px 14px; border-radius: 8px; border: none;
    background: #333; color: #eee; cursor: pointer; flex-shrink: 0;
  }
  #btnAddSetlist, #btnStartSetlist, #btnSongPickerDone {
    background: #6cf; color: #111; font-weight: bold;
  }
  #setlistList, #setlistSongs, #songPickerList { display: flex; flex-direction: column; gap: 10px; }
  #setlistList .empty, #setlistSongs .empty, #songPickerList .empty {
    color: #999; font-size: 14px; text-align: center; margin-top: 40px;
  }
  .setlistRow, .setlistSongRow, .pickerRow {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px;
    background: #1c1c1c; border-radius: 10px;
  }
  .setlistRow .songMain, .pickerRow .songMain { flex: 1; min-width: 0; cursor: pointer; }
  .setlistSongRow .songMain { flex: 1; min-width: 0; }
  .setlistSongIndex { color: #999; font-size: 13px; width: 22px; flex-shrink: 0; }
  .setlistRow button, .setlistSongRow button, .pickerRow button {
    font-size: 13px; padding: 8px 10px; border-radius: 6px; border: none;
    background: #333; color: #eee; cursor: pointer; flex-shrink: 0;
  }
  #setlistEditFooter { display: flex; gap: 10px; margin-top: 16px; }

  /* --- ビューア画面 --- */
  #viewer { position: absolute; inset: 0; }
  #viewer.hidden { display: none; }
  #scrollWrap {
    position: absolute; inset: 0; overflow: hidden; touch-action: none;
    background: #222;
  }
  #tileContainer {
    position: absolute; top: 0; left: 0; width: 100%;
    will-change: transform;
  }
  #tileContainer canvas { display: block; width: 100%; }

  #memoLayer {
    position: absolute; top: 0; left: 0; width: 100%;
    will-change: transform; pointer-events: none;
  }
  .memo {
    position: absolute; pointer-events: none;
  }
  #viewer.memo-edit-mode .memo {
    pointer-events: auto; cursor: grab; outline: 2px dashed #6cf; outline-offset: 2px;
  }
  .memo-text {
    max-width: 220px; padding: 6px 9px; border-radius: 6px; font-size: 13px;
    line-height: 1.4; white-space: pre-wrap; background: rgba(255, 224, 130, 0.95);
    color: #111; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .memo-image img {
    display: block; width: 100%; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .memo-resize-handle {
    position: absolute; right: -6px; bottom: -6px; width: 16px; height: 16px;
    background: #6cf; border: 2px solid #111; border-radius: 3px; cursor: nwse-resize;
    display: none;
  }
  #viewer.memo-edit-mode .memo-resize-handle { display: block; }
  .memo-delete {
    position: absolute; top: -10px; right: -10px; width: 22px; height: 22px;
    border-radius: 50%; border: none; background: #c33; color: #fff;
    font-size: 14px; line-height: 1; cursor: pointer; display: none;
  }
  #viewer.memo-edit-mode .memo-delete { display: block; }

  #memoImageInput { display: none; }
  .memoEditOnly { display: none; }
  #viewer.memo-edit-mode .memoEditOnly { display: inline-block; }
  .setlistOnly { display: none; }
  #viewer.setlist-active .setlistOnly { display: inline-block; }

  #setlistMemoView {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 40px; text-align: center; background: #111; z-index: 3;
  }
  #setlistMemoView p {
    font-size: 28px; line-height: 1.6; white-space: pre-wrap; max-width: 700px; margin: 0;
  }
  #viewer.setlist-memo-mode #setlistMemoView { display: flex; }
  #viewer.setlist-memo-mode #scrollWrap,
  #viewer.setlist-memo-mode #progressBar,
  #viewer.setlist-memo-mode #btnMemoEdit,
  #viewer.setlist-memo-mode #btnEditBpm,
  #viewer.setlist-memo-mode #btnMetronome,
  #viewer.setlist-memo-mode #btnSpeedDown,
  #viewer.setlist-memo-mode #speedLabel,
  #viewer.setlist-memo-mode #btnSpeedUp,
  #viewer.setlist-memo-mode #btnPlay {
    display: none;
  }

  #progressBar {
    position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: rgba(255,255,255,0.15); z-index: 5;
  }
  #progressFill { height: 100%; width: 0%; background: #6cf; }

  #toolbar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: rgba(17,17,17,0.85); backdrop-filter: blur(4px);
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  #toolbar.hidden { transform: translateY(100%); opacity: 0; pointer-events: none; }
  #toolbar button {
    font-size: 16px; padding: 10px 14px; border-radius: 8px; border: none;
    background: #333; color: #eee; cursor: pointer;
  }
  #toolbar button:active { background: #6cf; color: #111; }
  #toolbar button:disabled { opacity: 0.35; cursor: default; }
  #btnMetronome.active { background: #6cf; color: #111; }
  #btnPlay { min-width: 84px; font-weight: bold; }
  #speedLabel { min-width: 78px; text-align: center; font-variant-numeric: tabular-nums; }
  #btnBack { margin-right: auto; font-size: 13px; opacity: 0.8; }
</style>
</head>
<body>
<div id="app">

  <div id="songListScreen">
    <div id="songListHeader">
      <h1>ChordWiki Live Viewer</h1>
      <button id="btnGoSetlists">セットリスト</button>
      <button id="btnAddSong">＋ 曲を追加</button>
    </div>
    <div id="backupBar">
      <span id="lastBackupInfo"></span>
      <button id="btnSync">クラウド同期</button>
      <button id="btnCopySetupLink">セットアップリンクをコピー</button>
      <button id="btnExportZip">バックアップを書き出す</button>
      <button id="btnImportZip">ZIPを読み込む</button>
    </div>
    <div id="songList"></div>
    <input id="fileInput" type="file" accept="image/*,application/pdf">
    <input id="zipInput" type="file" accept=".zip,application/zip">
  </div>

  <div id="setlistListScreen" class="hidden">
    <div id="setlistListHeader">
      <button id="btnSetlistBack">&larr; 曲一覧</button>
      <h1>セットリスト</h1>
      <button id="btnAddSetlist">＋ 作成</button>
    </div>
    <div id="setlistList"></div>
  </div>

  <div id="setlistEditScreen" class="hidden">
    <div id="setlistEditHeader">
      <button id="btnSetlistEditBack">&larr; セットリスト一覧</button>
      <h1 id="setlistEditName">-</h1>
      <button id="btnRenameSetlist">名前変更</button>
      <button id="btnDeleteSetlist">削除</button>
    </div>
    <div id="setlistSongs"></div>
    <div id="setlistEditFooter">
      <button id="btnAddSongToSetlist">＋ 曲を追加</button>
      <button id="btnAddMemoToSetlist">＋ メモを追加</button>
      <button id="btnStartSetlist">&#9654; 演奏開始</button>
    </div>
  </div>

  <div id="songPickerScreen" class="hidden">
    <div id="songPickerHeader">
      <button id="btnSongPickerDone">完了</button>
      <h1>曲を選択して追加</h1>
    </div>
    <div id="songPickerList"></div>
  </div>

  <div id="viewer" class="hidden">
    <div id="scrollWrap">
      <div id="tileContainer"></div>
      <div id="memoLayer"></div>
    </div>
    <div id="setlistMemoView"><p id="setlistMemoText"></p></div>
    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="toolbar">
      <button id="btnBack">&larr; 曲一覧</button>
      <button id="btnPrevSong" class="setlistOnly">&#9198; 前</button>
      <button id="btnNextSong" class="setlistOnly">次 &#9197;</button>
      <button id="btnMemoEdit">&#9998; 編集</button>
      <button id="btnAddTextMemo" class="memoEditOnly">+ テキスト</button>
      <button id="btnAddImageMemo" class="memoEditOnly">+ 画像</button>
      <button id="btnEditBpm" class="memoEditOnly">BPM: --</button>
      <button id="btnMetronome">&#128276; クリック</button>
      <button id="btnSpeedDown">&minus;</button>
      <span id="speedLabel">40 px/s</span>
      <button id="btnSpeedUp">+</button>
      <button id="btnPlay">&#9654; 再生</button>
    </div>
    <input id="memoImageInput" type="file" accept="image/*">
  </div>

</div>

<script>
(() => {
  'use strict';

  // 実機(devtoolsを開けない環境)でも原因が分かるよう、想定外のエラーはアラート表示する
  window.addEventListener('error', (e) => {
    alert('JSエラー: ' + e.message);
  });
  window.addEventListener('unhandledrejection', (e) => {
    const reason = e.reason;
    alert('Promiseエラー: ' + (reason && reason.message ? reason.message : reason));
  });

  // ---- 定数 ----
  const TILE_HEIGHT_CSS = 1024; // iPad Safariの巨大画像描画問題対策としてタイル分割
  const MIN_SPEED = 1;
  const DEFAULT_SPEED = 40; // 曲未選択時・新規追加時の初期値
  const DPR = Math.min(window.devicePixelRatio || 1, 2); // メモリ/性能のため上限2

  // ---- DOM ----
  const songListScreen = document.getElementById('songListScreen');
  const songListEl = document.getElementById('songList');
  const btnAddSong = document.getElementById('btnAddSong');
  const fileInput = document.getElementById('fileInput');
  const zipInput = document.getElementById('zipInput');
  const btnExportZip = document.getElementById('btnExportZip');
  const btnImportZip = document.getElementById('btnImportZip');
  const lastBackupInfo = document.getElementById('lastBackupInfo');
  const btnSync = document.getElementById('btnSync');
  const btnCopySetupLink = document.getElementById('btnCopySetupLink');
  const btnGoSetlists = document.getElementById('btnGoSetlists');

  const setlistListScreen = document.getElementById('setlistListScreen');
  const setlistListEl = document.getElementById('setlistList');
  const btnSetlistBack = document.getElementById('btnSetlistBack');
  const btnAddSetlist = document.getElementById('btnAddSetlist');

  const setlistEditScreen = document.getElementById('setlistEditScreen');
  const setlistEditName = document.getElementById('setlistEditName');
  const setlistSongsEl = document.getElementById('setlistSongs');
  const btnSetlistEditBack = document.getElementById('btnSetlistEditBack');
  const btnRenameSetlist = document.getElementById('btnRenameSetlist');
  const btnDeleteSetlist = document.getElementById('btnDeleteSetlist');
  const btnAddSongToSetlist = document.getElementById('btnAddSongToSetlist');
  const btnAddMemoToSetlist = document.getElementById('btnAddMemoToSetlist');
  const btnStartSetlist = document.getElementById('btnStartSetlist');

  const songPickerScreen = document.getElementById('songPickerScreen');
  const songPickerListEl = document.getElementById('songPickerList');
  const btnSongPickerDone = document.getElementById('btnSongPickerDone');

  const btnPrevSong = document.getElementById('btnPrevSong');
  const btnNextSong = document.getElementById('btnNextSong');
  const setlistMemoView = document.getElementById('setlistMemoView');
  const setlistMemoText = document.getElementById('setlistMemoText');

  const viewer = document.getElementById('viewer');
  const scrollWrap = document.getElementById('scrollWrap');
  const tileContainer = document.getElementById('tileContainer');
  const memoLayerEl = document.getElementById('memoLayer');
  const progressFill = document.getElementById('progressFill');
  const toolbar = document.getElementById('toolbar');
  const btnPlay = document.getElementById('btnPlay');
  const btnBack = document.getElementById('btnBack');
  const btnMemoEdit = document.getElementById('btnMemoEdit');
  const btnAddTextMemo = document.getElementById('btnAddTextMemo');
  const btnAddImageMemo = document.getElementById('btnAddImageMemo');
  const memoImageInput = document.getElementById('memoImageInput');
  const btnEditBpm = document.getElementById('btnEditBpm');
  const btnMetronome = document.getElementById('btnMetronome');
  const btnSpeedUp = document.getElementById('btnSpeedUp');
  const btnSpeedDown = document.getElementById('btnSpeedDown');
  const speedLabel = document.getElementById('speedLabel');

  // ---- 状態 ----
  let contentHeight = 0;   // タイル全体のCSS高さ
  let scrollY = 0;         // 現在のスクロール位置(0=先頭)
  let playing = false;
  let speed = DEFAULT_SPEED; // px/秒。曲を開くと保存済みの値に置き換わる
  let rafId = null;
  let lastTs = null;
  let wakeLockSentinel = null;
  let currentSourceKind = null; // 'image' | 'pdf'
  let currentImageEl = null;    // kind==='image' 用。リサイズ時の再タイル化に使う
  let currentPdfDoc = null;     // kind==='pdf' 用
  let currentSongId = null;     // IndexedDBに保存されている曲のid(未保存時はnull)
  let currentMemos = [];        // 開いている曲のメモ配列
  let currentBpm = null;        // 開いている曲のBPM(未設定はnull)
  let memoEditMode = false;
  let pendingMemoType = null;   // 'text' | 'image' | null。配置待ちの種類
  let pendingMemoPlacement = null; // 画像配置のタップ位置(貼り付け用に保持)
  let memoObjectUrls = [];      // renderMemosで作ったBlob URL(再描画のたびに解放する)
  let currentSetlistId = null;  // セットリスト編集画面で開いているセットリストのid
  let activeSetlist = null;     // ビューアで演奏中のセットリスト({id,uuid,name,items}) or null
  let activeSetlistIndex = -1;  // activeSetlist内の現在の曲インデックス
  let viewerReturnScreen = null; // ビューアの「戻る」で戻る先の画面

  // ---- 画面切り替え ----
  const allScreens = [songListScreen, setlistListScreen, setlistEditScreen, songPickerScreen, viewer];
  function showScreen(screen) {
    for (const s of allScreens) s.classList.toggle('hidden', s !== screen);
  }

  // ==================================================
  // IndexedDB(曲の保存: 画像/PDF・曲名・速度・BPM)
  // ==================================================
  const DB_NAME = 'chordwiki-live-viewer';
  const DB_VERSION = 2;
  const STORE = 'songs';
  const SETLIST_STORE = 'setlists';
  let dbPromise = null;

  function openDb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) {
          db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
        }
        if (!db.objectStoreNames.contains(SETLIST_STORE)) {
          db.createObjectStore(SETLIST_STORE, { keyPath: 'id', autoIncrement: true });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  async function dbAdd(song) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      const req = tx.objectStore(STORE).add(song);
      req.onsuccess = () => resolve(req.result); // 新規id
      req.onerror = () => reject(req.error);
    });
  }

  async function dbPut(song) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      const req = tx.objectStore(STORE).put(song);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbGetAll() {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbGet(id) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbDelete(id) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      const req = tx.objectStore(STORE).delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  // ---- セットリスト用CRUD(曲とは別のオブジェクトストア) ----
  async function slAdd(setlist) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(SETLIST_STORE, 'readwrite');
      const req = tx.objectStore(SETLIST_STORE).add(setlist);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function slPut(setlist) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(SETLIST_STORE, 'readwrite');
      const req = tx.objectStore(SETLIST_STORE).put(setlist);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function slGetAll() {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(SETLIST_STORE, 'readonly');
      const req = tx.objectStore(SETLIST_STORE).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function slGet(id) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(SETLIST_STORE, 'readonly');
      const req = tx.objectStore(SETLIST_STORE).get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function slDelete(id) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(SETLIST_STORE, 'readwrite');
      const req = tx.objectStore(SETLIST_STORE).delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }
  // uuidの後付けに加え、旧形式(songUuidsのみ)のセットリストをitems形式
  // ({type:'song',uuid} / {type:'memo',id,text}の配列)へその場で移行する。
  async function ensureSetlistUuid(setlist) {
    let changed = false;
    if (!setlist.uuid) {
      setlist.uuid = crypto.randomUUID();
      changed = true;
    }
    if (!setlist.items) {
      setlist.items = (setlist.songUuids || []).map((uuid) => ({ type: 'song', uuid }));
      changed = true;
    }
    if (changed) await slPut(setlist);
    return setlist;
  }
  async function findSongByUuid(uuid) {
    const all = await dbGetAll();
    return all.find((s) => s.uuid === uuid);
  }

  // ZIPバックアップ/Cloudflare同期での同一曲判定に使う固定ID。
  // 古いデータ(このフィールド導入前に追加された曲)には読み出し時に後付けで割り当てる。
  async function ensureSongUuid(song) {
    if (song.uuid) return song;
    song.uuid = crypto.randomUUID();
    await dbPut(song);
    return song;
  }

  // 曲データはIndexedDBにBlob/Fileとしてではなく、生のArrayBuffer(dataフィールド)で
  // 保存する。Safariには、fetchのレスポンスから得たBlobを直接IndexedDBへ保存すると
  // 「Error preparing Blob/File data to be stored in object store」で失敗する既知の
  // 不具合があるため。古いテストデータ(blobフィールド)との互換のため両対応にする。
  async function getSongArrayBuffer(song) {
    if (song.data) return song.data;
    if (song.blob) return await song.blob.arrayBuffer();
    throw new Error('曲データが見つかりません');
  }

  function viewportHeight() { return scrollWrap.clientHeight; }
  function viewportWidthCss() { return scrollWrap.clientWidth; }
  function maxScroll() { return Math.max(0, contentHeight - viewportHeight()); }
  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  // ==================================================
  // タイル生成
  // ==================================================
  function makeTileCanvas(cssWidth, cssHeight) {
    const c = document.createElement('canvas');
    c.width = Math.round(cssWidth * DPR);
    c.height = Math.round(cssHeight * DPR);
    c.style.width = cssWidth + 'px';
    c.style.height = cssHeight + 'px';
    return c;
  }

  // <img> などの描画可能ソースから、スケールしつつタイルへ直接描画する。
  // 拡大後の画像全体を中間キャンバスに一度に描かない(それ自体が巨大描画問題の原因になるため)。
  function tileFromDrawableSource(img, naturalWidth, naturalHeight) {
    const cssWidth = viewportWidthCss();
    const scale = cssWidth / naturalWidth;
    const cssHeight = naturalHeight * scale;
    const tileCount = Math.ceil(cssHeight / TILE_HEIGHT_CSS);
    for (let i = 0; i < tileCount; i++) {
      const tileCssH = Math.min(TILE_HEIGHT_CSS, cssHeight - i * TILE_HEIGHT_CSS);
      const canvas = makeTileCanvas(cssWidth, tileCssH);
      const ctx = canvas.getContext('2d');
      ctx.scale(DPR, DPR);
      const sy = (i * TILE_HEIGHT_CSS) / scale;
      const sh = tileCssH / scale;
      ctx.drawImage(img, 0, sy, naturalWidth, sh, 0, 0, cssWidth, tileCssH);
      tileContainer.appendChild(canvas);
    }
    return cssHeight;
  }

  // 既にレンダリング済みのcanvas(PDFページ等)から、デバイスピクセル単位でそのまま切り出す。
  function tileFromRenderedCanvas(pageCanvas, cssWidth) {
    const tileHeightPx = Math.round(TILE_HEIGHT_CSS * DPR);
    const tileCount = Math.ceil(pageCanvas.height / tileHeightPx);
    let cssHeightTotal = 0;
    for (let i = 0; i < tileCount; i++) {
      const tilePx = Math.min(tileHeightPx, pageCanvas.height - i * tileHeightPx);
      const tileCssH = tilePx / DPR;
      const canvas = makeTileCanvas(cssWidth, tileCssH);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(pageCanvas, 0, i * tileHeightPx, pageCanvas.width, tilePx, 0, 0, canvas.width, tilePx);
      tileContainer.appendChild(canvas);
      cssHeightTotal += tileCssH;
    }
    return cssHeightTotal;
  }

  function clearTiles() {
    tileContainer.innerHTML = '';
    clearMemoLayer();
    contentHeight = 0;
    scrollY = 0;
    applyTransform();
  }

  async function buildTilesFromImage(img) {
    clearTiles();
    contentHeight = tileFromDrawableSource(img, img.naturalWidth, img.naturalHeight);
    applyTransform();
  }

  async function buildTilesFromPdf(pdf) {
    clearTiles();
    const cssWidth = viewportWidthCss();
    let total = 0;
    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const baseViewport = page.getViewport({ scale: 1 });
      const renderScale = (cssWidth * DPR) / baseViewport.width;
      const viewport = page.getViewport({ scale: renderScale });

      const pageCanvas = document.createElement('canvas');
      pageCanvas.width = Math.round(viewport.width);
      pageCanvas.height = Math.round(viewport.height);
      const pageCtx = pageCanvas.getContext('2d');
      await page.render({ canvasContext: pageCtx, viewport }).promise;

      total += tileFromRenderedCanvas(pageCanvas, cssWidth);

      // iOS Safariはcanvasメモリが厳しいため、ページ描画後すぐ解放する
      pageCanvas.width = 0;
      pageCanvas.height = 0;
    }
    contentHeight = total;
    applyTransform();
  }

  function rebuildCurrentSource() {
    let p = null;
    if (currentSourceKind === 'image' && currentImageEl) {
      p = buildTilesFromImage(currentImageEl);
    } else if (currentSourceKind === 'pdf' && currentPdfDoc) {
      p = buildTilesFromPdf(currentPdfDoc);
    }
    if (p) p.then(renderMemos); // 画面幅が変わるとメモの位置も再計算が必要
  }

  // ==================================================
  // スクロール再生
  // ==================================================
  function applyTransform() {
    const t = `translate3d(0, ${-scrollY}px, 0)`;
    tileContainer.style.transform = t;
    memoLayerEl.style.transform = t;
    const m = maxScroll();
    progressFill.style.width = (m > 0 ? (scrollY / m * 100) : 0) + '%';
  }

  function tick(ts) {
    if (!playing) return;
    if (lastTs === null) lastTs = ts;
    const dt = (ts - lastTs) / 1000;
    lastTs = ts;
    scrollY += speed * dt;
    const m = maxScroll();
    if (scrollY >= m) {
      scrollY = m;
      applyTransform();
      stopPlayback(); // 末尾到達で自動停止
      return;
    }
    applyTransform();
    rafId = requestAnimationFrame(tick);
  }

  function startPlayback() {
    if (playing || contentHeight === 0) return;
    if (scrollY >= maxScroll()) scrollY = 0; // 末尾で止まっていたら先頭から
    playing = true;
    lastTs = null;
    rafId = requestAnimationFrame(tick);
    acquireWakeLock();
    scheduleToolbarHide();
    btnPlay.innerHTML = '&#10074;&#10074; 停止';
  }

  function stopPlayback() {
    playing = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    releaseWakeLock();
    showToolbar();
    btnPlay.innerHTML = '&#9654; 再生';
  }

  btnPlay.addEventListener('click', () => {
    if (playing) stopPlayback(); else startPlayback();
  });

  // ==================================================
  // 手動ドラッグ(再生中はドラッグ中一時停止、離すと自動再開)
  // ==================================================
  let dragging = false;
  let dragStartX = 0;
  let dragStartY = 0;
  let dragStartScrollY = 0;
  let wasPlayingBeforeDrag = false;

  scrollWrap.addEventListener('pointerdown', (e) => {
    dragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragStartScrollY = scrollY;
    wasPlayingBeforeDrag = playing;
    if (playing) stopPlayback();
    showToolbar();
    scrollWrap.setPointerCapture(e.pointerId);
  });
  scrollWrap.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const deltaY = e.clientY - dragStartY;
    scrollY = clamp(dragStartScrollY - deltaY, 0, maxScroll());
    applyTransform();
  });
  scrollWrap.addEventListener('pointerup', endDrag);
  scrollWrap.addEventListener('pointercancel', endDrag);
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    const moved = e ? Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY) : 999;
    // メモ編集モードで種類を選択済みなら、ほぼ動いていないタップを配置操作として扱う
    if (memoEditMode && pendingMemoType && moved < 8 && e) {
      const type = pendingMemoType;
      pendingMemoType = null;
      placeMemoAt(e.clientX, e.clientY, type);
      return;
    }
    if (wasPlayingBeforeDrag) startPlayback();
  }

  // マウスホイール/トラックパッド操作(PC検証用)。ドラッグと同様に、操作中は一時停止し
  // 操作が止まってから少し経ったら自動再開する。
  let wheelResumeTimer = null;
  scrollWrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const wasPlaying = playing;
    if (playing) stopPlayback();
    scrollY = clamp(scrollY + e.deltaY, 0, maxScroll());
    applyTransform();
    showToolbar();
    clearTimeout(wheelResumeTimer);
    if (wasPlaying) {
      wheelResumeTimer = setTimeout(startPlayback, 400);
    }
  }, { passive: false });

  // ==================================================
  // メモ(譜面画像上の相対座標に配置し、タイルと一緒にスクロールする)
  // x, yは0〜1の範囲。コンテンツ幅・高さに対する割合で保持することで、
  // 端末やタイル再生成後も同じ位置に描画できるようにしている。
  // ==================================================
  function clearMemoLayer() {
    for (const url of memoObjectUrls) URL.revokeObjectURL(url);
    memoObjectUrls = [];
    memoLayerEl.innerHTML = '';
  }

  function renderMemos() {
    clearMemoLayer();
    memoLayerEl.style.height = contentHeight + 'px';
    const cssWidth = viewportWidthCss();
    for (const memo of currentMemos) {
      const el = document.createElement('div');
      el.className = memo.type === 'text' ? 'memo memo-text' : 'memo memo-image';
      el.style.left = Math.round(memo.x * cssWidth) + 'px';
      el.style.top = Math.round(memo.y * contentHeight) + 'px';

      if (memo.type === 'text') {
        el.textContent = memo.text;
      } else {
        const img = document.createElement('img');
        const url = URL.createObjectURL(new Blob([memo.data], { type: memo.mimeType }));
        memoObjectUrls.push(url);
        img.src = url;
        img.style.width = (memo.width || 160) + 'px';
        el.appendChild(img);
        el.appendChild(makeResizeHandle(memo, img));
      }

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'memo-delete';
      delBtn.textContent = '×';
      delBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
      delBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm('このメモを削除しますか？')) return;
        currentMemos = currentMemos.filter((m) => m.id !== memo.id);
        await saveCurrentMemos();
        renderMemos();
      });
      el.appendChild(delBtn);

      bindMemoDrag(el, memo);
      memoLayerEl.appendChild(el);
    }
  }

  function bindMemoDrag(el, memo) {
    el.addEventListener('pointerdown', (e) => {
      if (!memoEditMode) return;
      e.stopPropagation(); // scrollWrap側のスクロール開始を防ぐ
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      const startClientX = e.clientX;
      const startClientY = e.clientY;
      const startLeft = parseFloat(el.style.left);
      const startTop = parseFloat(el.style.top);
      let moved = false;

      const onMove = (ev) => {
        const dx = ev.clientX - startClientX;
        const dy = ev.clientY - startClientY;
        if (Math.hypot(dx, dy) > 4) moved = true;
        el.style.left = (startLeft + dx) + 'px';
        el.style.top = (startTop + dy) + 'px';
      };
      const onUp = async () => {
        el.removeEventListener('pointermove', onMove);
        el.removeEventListener('pointerup', onUp);
        el.removeEventListener('pointercancel', onUp);
        if (moved) {
          const cssWidth = viewportWidthCss();
          memo.x = clamp(parseFloat(el.style.left) / cssWidth, 0, 1);
          memo.y = contentHeight > 0 ? clamp(parseFloat(el.style.top) / contentHeight, 0, 1) : 0;
          memo.updatedAt = Date.now();
          await saveCurrentMemos();
        } else if (memo.type === 'text') {
          const newText = prompt('メモを編集', memo.text);
          if (newText !== null && newText.trim()) {
            memo.text = newText;
            memo.updatedAt = Date.now();
            await saveCurrentMemos();
            renderMemos();
          }
        }
      };
      el.addEventListener('pointermove', onMove);
      el.addEventListener('pointerup', onUp);
      el.addEventListener('pointercancel', onUp);
    });
  }

  function makeResizeHandle(memo, img) {
    const handle = document.createElement('div');
    handle.className = 'memo-resize-handle';
    handle.addEventListener('pointerdown', (e) => {
      if (!memoEditMode) return;
      e.stopPropagation(); // 親要素(.memo)の移動ドラッグを発火させない
      e.preventDefault();
      handle.setPointerCapture(e.pointerId);
      const startClientX = e.clientX;
      const startWidth = memo.width || img.getBoundingClientRect().width || 160;

      const onMove = (ev) => {
        const dx = ev.clientX - startClientX;
        const newWidth = clamp(startWidth + dx, 40, 600);
        img.style.width = newWidth + 'px';
      };
      const onUp = async () => {
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
        handle.removeEventListener('pointercancel', onUp);
        memo.width = parseFloat(img.style.width);
        memo.updatedAt = Date.now();
        await saveCurrentMemos();
      };
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
      handle.addEventListener('pointercancel', onUp);
    });
    return handle;
  }

  function placeMemoAt(clientX, clientY, type) {
    const rect = scrollWrap.getBoundingClientRect();
    const xCss = clientX - rect.left;
    const yCss = (clientY - rect.top) + scrollY; // ビューポート座標→コンテンツ座標に変換
    const cssWidth = viewportWidthCss();
    const x = clamp(xCss / cssWidth, 0, 1);
    const y = contentHeight > 0 ? clamp(yCss / contentHeight, 0, 1) : 0;

    if (type === 'text') {
      const text = prompt('メモの内容を入力してください');
      if (!text || !text.trim()) return;
      addMemo({ id: crypto.randomUUID(), type: 'text', x, y, text: text.trim(), createdAt: Date.now(), updatedAt: Date.now() });
    } else {
      memoImageInput.dataset.pendingX = String(x);
      memoImageInput.dataset.pendingY = String(y);
      pendingMemoPlacement = { x, y };
      alert('画像を選択するか、この画面に貼り付け(Ctrl+V)してください');
      memoImageInput.click();
    }
  }

  async function addImageMemoFromFile(file, x, y) {
    const data = await file.arrayBuffer();
    await addMemo({
      id: crypto.randomUUID(), type: 'image', x, y,
      data, mimeType: file.type || 'image/png', width: 160,
      createdAt: Date.now(), updatedAt: Date.now(),
    });
  }

  // クリップボードから画像を貼り付け(コピペ対応)。tap→種類選択で位置決め済みの時だけ有効。
  document.addEventListener('paste', (e) => {
    if (!memoEditMode || !pendingMemoPlacement) return;
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        const file = item.getAsFile();
        if (!file) continue;
        const { x, y } = pendingMemoPlacement;
        pendingMemoPlacement = null;
        addImageMemoFromFile(file, x, y);
        break;
      }
    }
  });

  async function addMemo(memo) {
    currentMemos.push(memo);
    await saveCurrentMemos();
    renderMemos();
  }

  async function saveCurrentMemos() {
    if (currentSongId == null) return;
    const song = await dbGet(currentSongId);
    if (!song) return;
    song.memos = currentMemos;
    song.updatedAt = Date.now();
    await dbPut(song);
  }

  memoImageInput.addEventListener('change', async () => {
    const file = memoImageInput.files && memoImageInput.files[0];
    const x = parseFloat(memoImageInput.dataset.pendingX);
    const y = parseFloat(memoImageInput.dataset.pendingY);
    memoImageInput.value = '';
    pendingMemoPlacement = null;
    if (!file) return;
    await addImageMemoFromFile(file, x, y);
  });

  btnMemoEdit.addEventListener('click', () => {
    memoEditMode = !memoEditMode;
    pendingMemoType = null;
    pendingMemoPlacement = null;
    viewer.classList.toggle('memo-edit-mode', memoEditMode);
    if (memoEditMode) stopPlayback();
  });
  btnAddTextMemo.addEventListener('click', () => {
    pendingMemoType = 'text';
    alert('配置したい場所を譜面上でタップしてください');
  });
  btnAddImageMemo.addEventListener('click', () => {
    pendingMemoType = 'image';
    alert('配置したい場所を譜面上でタップしてください');
  });

  // ==================================================
  // BPM編集
  // ==================================================
  function updateBpmLabel() {
    btnEditBpm.textContent = currentBpm != null ? `BPM: ${currentBpm}` : 'BPM: --';
  }

  async function saveCurrentBpm() {
    if (currentSongId == null) return;
    const song = await dbGet(currentSongId);
    if (!song) return;
    song.bpm = currentBpm;
    song.updatedAt = Date.now();
    await dbPut(song);
  }

  btnEditBpm.addEventListener('click', async () => {
    const input = prompt('BPMを入力してください(空欄で未設定)', currentBpm != null ? String(currentBpm) : '');
    if (input === null) return;
    const bpm = input.trim() ? parseInt(input, 10) : null;
    currentBpm = Number.isFinite(bpm) ? bpm : null;
    updateBpmLabel();
    await saveCurrentBpm();
  });

  // ==================================================
  // メトロノーム(Web Audio)
  // rAFやsetTimeoutだけで刻むと時間ズレが蓄積するため、AudioContextの時刻を基準に
  // 少し先まで予約するルックアヘッド方式にする(定番の実装パターン)。
  // ==================================================
  let audioCtx = null;
  let metronomePlaying = false;
  let metronomeTimerId = null;
  let nextClickTime = 0;
  const METRONOME_LOOKAHEAD_MS = 25;
  const METRONOME_SCHEDULE_AHEAD_SEC = 0.1;

  function ensureAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function scheduleClick(time) {
    const ctx = ensureAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 1000;
    gain.gain.setValueAtTime(0.4, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.03);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(time);
    osc.stop(time + 0.03);
  }

  function metronomeScheduler() {
    const ctx = ensureAudioCtx();
    while (nextClickTime < ctx.currentTime + METRONOME_SCHEDULE_AHEAD_SEC) {
      scheduleClick(nextClickTime);
      nextClickTime += 60 / currentBpm;
    }
    metronomeTimerId = setTimeout(metronomeScheduler, METRONOME_LOOKAHEAD_MS);
  }

  function startMetronome() {
    if (!currentBpm) {
      alert('BPMが未設定です。「編集」を押してBPMを設定してください。');
      return;
    }
    const ctx = ensureAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    nextClickTime = ctx.currentTime + 0.05;
    metronomePlaying = true;
    metronomeScheduler();
    btnMetronome.textContent = '\u{1F515} 停止';
    btnMetronome.classList.add('active');
  }

  function stopMetronome() {
    metronomePlaying = false;
    clearTimeout(metronomeTimerId);
    btnMetronome.textContent = '\u{1F514} クリック';
    btnMetronome.classList.remove('active');
  }

  btnMetronome.addEventListener('click', () => {
    if (metronomePlaying) stopMetronome(); else startMetronome();
  });

  // ==================================================
  // 速度調整(1px/秒刻み、長押しで加速)
  // ==================================================
  let holdTimeout = null;
  let holdInterval = null;

  let speedSaveTimer = null;
  function changeSpeed(delta) {
    speed = Math.max(MIN_SPEED, speed + delta);
    speedLabel.textContent = `${speed} px/s`;
    scheduleSpeedSave();
  }

  function scheduleSpeedSave() {
    if (currentSongId == null) return;
    clearTimeout(speedSaveTimer);
    // currentSongIdをクロージャで固定する。「戻る」でcurrentSongIdがnullに
    // なった後にタイマーが発火しても、保存先を見失わないようにするため。
    const songId = currentSongId;
    const speedValue = speed;
    speedSaveTimer = setTimeout(() => { saveSongSpeed(songId, speedValue); }, 300); // 長押し連打の度にDB書き込みしない
  }

  function flushSpeedSave() {
    if (!speedSaveTimer) return;
    clearTimeout(speedSaveTimer);
    speedSaveTimer = null;
    if (currentSongId != null) saveSongSpeed(currentSongId, speed);
  }

  async function saveSongSpeed(songId, speedValue) {
    const song = await dbGet(songId);
    if (!song) return;
    song.speed = speedValue;
    song.updatedAt = Date.now();
    await dbPut(song);
  }

  function bindHold(button, sign) {
    const start = (e) => {
      e.preventDefault();
      changeSpeed(sign);
      let step = 1;
      holdTimeout = setTimeout(() => {
        holdInterval = setInterval(() => {
          changeSpeed(sign * step);
          step += 1; // 長押しで刻み加速
        }, 120);
      }, 500);
    };
    const stop = () => {
      clearTimeout(holdTimeout);
      clearInterval(holdInterval);
    };
    button.addEventListener('pointerdown', start);
    button.addEventListener('pointerup', stop);
    button.addEventListener('pointerleave', stop);
    button.addEventListener('pointercancel', stop);
  }
  bindHold(btnSpeedUp, +1);
  bindHold(btnSpeedDown, -1);

  // ==================================================
  // Wake Lock
  // ==================================================
  async function acquireWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLockSentinel = await navigator.wakeLock.request('screen');
    } catch (err) { /* 拒否・非対応時は無視 */ }
  }
  function releaseWakeLock() {
    if (wakeLockSentinel) { wakeLockSentinel.release(); wakeLockSentinel = null; }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && playing) acquireWakeLock();
  });

  // ==================================================
  // ツールバー自動非表示(再生中のみ)
  // ==================================================
  let toolbarHideTimer = null;
  function scheduleToolbarHide() {
    clearTimeout(toolbarHideTimer);
    toolbarHideTimer = setTimeout(() => {
      if (playing) toolbar.classList.add('hidden');
    }, 2500);
  }
  function showToolbar() {
    toolbar.classList.remove('hidden');
    if (playing) scheduleToolbarHide();
  }

  // ==================================================
  // 曲一覧
  // ==================================================
  function isPdfFile(file) {
    return file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  }
  function isImageFile(file) {
    return file.type.startsWith('image/');
  }

  async function renderSongList() {
    renderLastBackupInfo();
    const songs = await dbGetAll();
    await Promise.all(songs.map(ensureSongUuid));
    songs.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    songListEl.innerHTML = '';
    if (songs.length === 0) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'まだ曲がありません。「＋ 曲を追加」から譜面(画像/PDF)を登録してください。';
      songListEl.appendChild(p);
      return;
    }
    for (const song of songs) {
      const row = document.createElement('div');
      row.className = 'songRow';

      const main = document.createElement('div');
      main.className = 'songMain';
      const name = document.createElement('div');
      name.className = 'songName';
      name.textContent = song.name;
      const meta = document.createElement('div');
      meta.className = 'songMeta';
      meta.textContent = `${song.speed} px/s` + (song.bpm ? ` / BPM ${song.bpm}` : '');
      main.appendChild(name);
      main.appendChild(meta);
      main.addEventListener('click', () => openSong(song.id));

      const btnEdit = document.createElement('button');
      btnEdit.textContent = '編集';
      btnEdit.addEventListener('click', (e) => { e.stopPropagation(); editSong(song); });

      const btnDelete = document.createElement('button');
      btnDelete.textContent = '削除';
      btnDelete.addEventListener('click', (e) => { e.stopPropagation(); deleteSong(song); });

      row.appendChild(main);
      row.appendChild(btnEdit);
      row.appendChild(btnDelete);
      songListEl.appendChild(row);
    }
  }

  async function editSong(song) {
    const newName = prompt('曲名を変更', song.name);
    if (newName === null) return;
    const newBpmStr = prompt('BPM(任意、空欄で未設定)', song.bpm != null ? String(song.bpm) : '');
    if (newBpmStr === null) return;
    const bpm = newBpmStr.trim() ? parseInt(newBpmStr, 10) : null;
    song.name = newName.trim() || song.name;

  async function deleteSong(song) {
    if (!confirm(`「${song.name}」を削除しますか？`)) return;
    await dbDelete(song.id);

    // クラウド同期を使っている場合はサーバー側からも削除する。
    // ローカルだけ消すと、次回同期で「サーバーにあってローカルにない」と
    // 判定されて復活してしまうため。
    const key = localStorage.getItem(SYNC_KEY_STORAGE);
    if (key && song.uuid) {
      try {
        const res = await fetch(`${SYNC_API_URL}/api/songs/${song.uuid}`, {
          method: 'DELETE', headers: { 'X-Sync-Key': key },
        });
        if (!res.ok && res.status !== 404) {
          alert(`サーバー側の削除に失敗しました(次回同期で復活する可能性があります): ${res.status}`);
        }
      } catch (err) {
        console.error(err);
        alert('サーバーに接続できず、クラウド側の削除はスキップされました(次回同期で復活する可能性があります)');
      }
    }

    renderSongList();
  }

  // ==================================================
  // ZIPバックアップ(依存ライブラリなし、無圧縮STORE方式)
  // 画像/PDFは既に圧縮済み形式なので、DEFLATE圧縮のコストをかけても
  // ほぼ縮まない。CRC32計算とヘッダー書き込みだけで完結する。
  // ==================================================
  const LAST_BACKUP_KEY = 'cwlv_last_backup_at';
  const BACKUP_WARN_DAYS = 7;

  let crcTable = null;
  function crc32(bytes) {
    if (!crcTable) {
      crcTable = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        crcTable[n] = c >>> 0;
      }
    }
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) crc = crcTable[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function toDosDateTime(date) {
    const year = Math.max(1980, date.getFullYear());
    const dosDate = ((year - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
    const dosTime = (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2);
    return { dosDate, dosTime };
  }

  // entries: [{ name: string, data: Uint8Array }]
  function buildZip(entries) {
    const { dosDate, dosTime } = toDosDateTime(new Date());
    const localParts = [];
    const centralParts = [];
    let offset = 0;

    for (const entry of entries) {
      const nameBytes = new TextEncoder().encode(entry.name);
      const data = entry.data;
      const crc = crc32(data);

      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, 0, true);
      local.setUint16(8, 0, true); // method: STORE(無圧縮)
      local.setUint16(10, dosTime, true);
      local.setUint16(12, dosDate, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, data.length, true);
      local.setUint32(22, data.length, true);
      local.setUint16(26, nameBytes.length, true);
      local.setUint16(28, 0, true);
      const localBytes = new Uint8Array(local.buffer);
      localParts.push(localBytes, nameBytes, data);

      const central = new DataView(new ArrayBuffer(46));
      central.setUint32(0, 0x02014b50, true);
      central.setUint16(4, 20, true);
      central.setUint16(6, 20, true);
      central.setUint16(8, 0, true);
      central.setUint16(10, 0, true);
      central.setUint16(12, dosTime, true);
      central.setUint16(14, dosDate, true);
      central.setUint32(16, crc, true);
      central.setUint32(20, data.length, true);
      central.setUint32(24, data.length, true);
      central.setUint16(28, nameBytes.length, true);
      central.setUint16(30, 0, true);
      central.setUint16(32, 0, true);
      central.setUint16(34, 0, true);
      central.setUint16(36, 0, true);
      central.setUint32(38, 0, true);
      central.setUint32(42, offset, true);
      centralParts.push(new Uint8Array(central.buffer), nameBytes);

      offset += localBytes.length + nameBytes.length + data.length;
    }

    const centralStart = offset;
    const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);

    const eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true);
    eocd.setUint16(4, 0, true);
    eocd.setUint16(6, 0, true);
    eocd.setUint16(8, entries.length, true);
    eocd.setUint16(10, entries.length, true);
    eocd.setUint32(12, centralSize, true);
    eocd.setUint32(16, centralStart, true);
    eocd.setUint16(20, 0, true);

    return new Blob([...localParts, ...centralParts, new Uint8Array(eocd.buffer)], { type: 'application/zip' });
  }

  // このアプリが書き出したZIP(STORE方式・data descriptorなし)専用の簡易パーサー
  function parseZip(buf) {
    const view = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    let eocdOffset = -1;
    const scanStart = Math.max(0, buf.length - 22 - 65536);
    for (let i = buf.length - 22; i >= scanStart; i--) {
      if (view.getUint32(i, true) === 0x06054b50) { eocdOffset = i; break; }
    }
    if (eocdOffset < 0) {
      throw new Error('ZIPの終端レコードが見つかりません(壊れているか、対応していない形式です)');
    }

    const entryCount = view.getUint16(eocdOffset + 10, true);
    let centralOffset = view.getUint32(eocdOffset + 16, true);
    const entries = [];

    for (let i = 0; i < entryCount; i++) {
      if (view.getUint32(centralOffset, true) !== 0x02014b50) {
        throw new Error('セントラルディレクトリの読み取りに失敗しました');
      }
      const method = view.getUint16(centralOffset + 10, true);
      const uncompSize = view.getUint32(centralOffset + 24, true);
      const nameLen = view.getUint16(centralOffset + 28, true);
      const extraLen = view.getUint16(centralOffset + 30, true);
      const commentLen = view.getUint16(centralOffset + 32, true);
      const localOffset = view.getUint32(centralOffset + 42, true);
      const name = new TextDecoder().decode(buf.subarray(centralOffset + 46, centralOffset + 46 + nameLen));

      if (method !== 0) {
        throw new Error(`未対応の圧縮方式です(${name})。このアプリで書き出したZIPのみ読み込めます。`);
      }

      const localNameLen = view.getUint16(localOffset + 26, true);
      const localExtraLen = view.getUint16(localOffset + 28, true);
      const dataStart = localOffset + 30 + localNameLen + localExtraLen;
      entries.push({ name, data: buf.subarray(dataStart, dataStart + uncompSize) });

      centralOffset += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function formatTimestampForFilename(date) {
    const pad = (n) => String(n).padStart(2, '0');
    return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}-${pad(date.getHours())}${pad(date.getMinutes())}`;
  }

  function renderLastBackupInfo() {
    const ts = parseInt(localStorage.getItem(LAST_BACKUP_KEY), 10);
    if (!Number.isFinite(ts)) {
      lastBackupInfo.textContent = '最終バックアップ: なし';
      lastBackupInfo.classList.add('warn');
      return;
    }
    const days = Math.floor((Date.now() - ts) / 86400000);
    lastBackupInfo.textContent = `最終バックアップ: ${days === 0 ? '今日' : days + '日前'}`;
    lastBackupInfo.classList.toggle('warn', days >= BACKUP_WARN_DAYS);
  }

  async function exportBackupZip() {
    const songs = await dbGetAll();
    await Promise.all(songs.map(ensureSongUuid));
    const setlists = await slGetAll();
    await Promise.all(setlists.map(ensureSetlistUuid));

    const songManifest = songs.map((s) => ({
      uuid: s.uuid, name: s.name, bpm: s.bpm, speed: s.speed,
      fileName: s.fileName, mimeType: s.mimeType,
      createdAt: s.createdAt, updatedAt: s.updatedAt,
      memos: (s.memos || []).map((m) => ({
        id: m.id, type: m.type, x: m.x, y: m.y,
        text: m.text, mimeType: m.mimeType, width: m.width,
        createdAt: m.createdAt, updatedAt: m.updatedAt,
      })),
    }));
    const setlistManifest = setlists.map((sl) => ({
      uuid: sl.uuid, name: sl.name, items: sl.items || [],
      createdAt: sl.createdAt, updatedAt: sl.updatedAt,
    }));
    const manifest = { songs: songManifest, setlists: setlistManifest };
    const entries = [
      { name: 'manifest.json', data: new TextEncoder().encode(JSON.stringify(manifest, null, 2)) },
    ];
    for (const s of songs) {
      const data = new Uint8Array(await getSongArrayBuffer(s));
      entries.push({ name: `songs/${s.uuid}_${s.fileName}`, data });
      for (const m of (s.memos || [])) {
        if (m.type === 'image' && m.data) {
          entries.push({ name: `songs/${s.uuid}_memo_${m.id}.bin`, data: new Uint8Array(m.data) });
        }
      }
    }

    const zipBlob = buildZip(entries);
    downloadBlob(zipBlob, `chordwiki-backup-${formatTimestampForFilename(new Date())}.zip`);
    localStorage.setItem(LAST_BACKUP_KEY, String(Date.now()));
    renderLastBackupInfo();
  }

  async function importBackupZip(file) {
    const buf = new Uint8Array(await file.arrayBuffer());
    const entries = parseZip(buf);
    const manifestEntry = entries.find((e) => e.name === 'manifest.json');
    if (!manifestEntry) {
      throw new Error('manifest.jsonが見つかりません(このアプリで書き出したZIPではない可能性があります)');
    }
    const parsed = JSON.parse(new TextDecoder().decode(manifestEntry.data));
    // 旧形式(曲の配列そのもの)との後方互換。新形式は{songs, setlists}。
    const songManifest = Array.isArray(parsed) ? parsed : (parsed.songs || []);
    const setlistManifest = Array.isArray(parsed) ? [] : (parsed.setlists || []);

    const existing = await dbGetAll();
    await Promise.all(existing.map(ensureSongUuid));
    const byUuid = new Map(existing.filter((s) => s.uuid).map((s) => [s.uuid, s]));

    let added = 0, updated = 0, skipped = 0;
    for (const meta of songManifest) {
      const fileEntry = entries.find((e) => e.name === `songs/${meta.uuid}_${meta.fileName}`);
      if (!fileEntry) continue;
      // subarrayのままだとZIP全体のバッファを参照し続けてしまうのでslice()でコピーする
      const data = fileEntry.data.slice().buffer;
      const memos = (meta.memos || []).map((m) => {
        if (m.type !== 'image') return m;
        const memoEntry = entries.find((e) => e.name === `songs/${meta.uuid}_memo_${m.id}.bin`);
        return { ...m, data: memoEntry ? memoEntry.data.slice().buffer : null };
      });
      const current = byUuid.get(meta.uuid);

      if (current) {
        // ローカルの方が新しければ古いバックアップで上書きしない
        if ((meta.updatedAt || 0) > (current.updatedAt || 0)) {
          Object.assign(current, {
            name: meta.name, bpm: meta.bpm, speed: meta.speed,
            data, fileName: meta.fileName, mimeType: meta.mimeType,
            memos, updatedAt: meta.updatedAt,
          });
          await dbPut(current);
          updated++;
        } else {
          skipped++;
        }
      } else {
        await dbAdd({
          uuid: meta.uuid, name: meta.name, bpm: meta.bpm, speed: meta.speed,
          data, fileName: meta.fileName, mimeType: meta.mimeType, memos,
          createdAt: meta.createdAt || Date.now(), updatedAt: meta.updatedAt || Date.now(),
        });
        added++;
      }
    }

    const existingSetlists = await slGetAll();
    await Promise.all(existingSetlists.map(ensureSetlistUuid));
    const setlistByUuid = new Map(existingSetlists.filter((s) => s.uuid).map((s) => [s.uuid, s]));
    for (const meta of setlistManifest) {
      // 旧バックアップ(songUuidsのみ)との後方互換
      const items = meta.items || (meta.songUuids || []).map((uuid) => ({ type: 'song', uuid }));
      const current = setlistByUuid.get(meta.uuid);
      if (current) {
        if ((meta.updatedAt || 0) > (current.updatedAt || 0)) {
          Object.assign(current, { name: meta.name, items, updatedAt: meta.updatedAt });
          await slPut(current);
          updated++;
        } else {
          skipped++;
        }
      } else {
        await slAdd({
          uuid: meta.uuid, name: meta.name, items,
          createdAt: meta.createdAt || Date.now(), updatedAt: meta.updatedAt || Date.now(),
        });
        added++;
      }
    }

    alert(`復元完了: 追加${added}件 / 更新${updated}件 / スキップ${skipped}件`);
    renderSongList();
    renderSetlistList();
  }

  btnExportZip.addEventListener('click', () => {
    exportBackupZip().catch((err) => {
      console.error(err);
      alert('書き出しエラー: ' + (err && err.message ? err.message : err));
    });
  });
  btnImportZip.addEventListener('click', () => zipInput.click());
  zipInput.addEventListener('change', () => {
    const file = zipInput.files && zipInput.files[0];
    zipInput.value = '';
    if (!file) return;
    importBackupZip(file).catch((err) => {
      console.error(err);
      alert('読み込みエラー: ' + (err && err.message ? err.message : err));
    });
  });

  // ==================================================
  // クラウド同期(Cloudflare Workers + D1 + R2)
  // uuidとupdatedAtを見て、新しい方を残す双方向マージ。ZIPバックアップと同じ考え方。
  // ==================================================
  const SYNC_API_URL = 'https://chordwiki-live-viewer.kento-kawamura-730.workers.dev';
  const SYNC_KEY_STORAGE = 'cwlv_sync_key';

  // URLに ?key=... が付いていたら自動保存してURLから消す。
  // 新しい端末でキーを手入力しなくて済むよう、このURLをLINE/メモ等で自分に送って
  // タップするだけでセットアップできるようにするため。
  (() => {
    const params = new URLSearchParams(location.search);
    const keyFromUrl = params.get('key');
    if (keyFromUrl) {
      localStorage.setItem(SYNC_KEY_STORAGE, keyFromUrl);
      params.delete('key');
      const newSearch = params.toString();
      history.replaceState(null, '', location.pathname + (newSearch ? `?${newSearch}` : ''));
    }
  })();

  function getSyncKey() {
    let key = localStorage.getItem(SYNC_KEY_STORAGE);
    if (!key) {
      key = prompt('同期キーを入力してください');
      if (key) localStorage.setItem(SYNC_KEY_STORAGE, key);
    }
    return key || null;
  }

  // memo画像はJSON(D1のTEXTカラム)に載せて送るためbase64にする
  function arrayBufferToBase64(buf) {
    let binary = '';
    const bytes = new Uint8Array(buf);
    const chunkSize = 0x8000;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  }
  function base64ToArrayBuffer(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  function serializeMemosForUpload(memos) {
    return (memos || []).map((m) => ({
      id: m.id, type: m.type, x: m.x, y: m.y, text: m.text,
      mimeType: m.mimeType, width: m.width,
      data: m.type === 'image' && m.data ? arrayBufferToBase64(m.data) : undefined,
      createdAt: m.createdAt, updatedAt: m.updatedAt,
    }));
  }
  function deserializeMemosFromRemote(memos) {
    return (memos || []).map((m) => ({
      ...m,
      data: m.type === 'image' && m.data ? base64ToArrayBuffer(m.data) : undefined,
    }));
  }

  async function uploadSong(key, song) {
    const form = new FormData();
    form.set('name', song.name);
    form.set('fileName', song.fileName);
    form.set('mimeType', song.mimeType);
    form.set('speed', String(song.speed));
    form.set('bpm', song.bpm != null ? String(song.bpm) : '');
    form.set('memos', JSON.stringify(serializeMemosForUpload(song.memos)));
    form.set('createdAt', String(song.createdAt));
    form.set('updatedAt', String(song.updatedAt));
    const buf = await getSongArrayBuffer(song);
    form.set('file', new Blob([buf], { type: song.mimeType }), song.fileName);
    const res = await fetch(`${SYNC_API_URL}/api/songs/${song.uuid}`, {
      method: 'PUT', headers: { 'X-Sync-Key': key }, body: form,
    });
    if (!res.ok) throw new Error(`アップロード失敗: ${song.name} (${res.status})`);
  }

  async function downloadSong(key, remote, existingLocal) {
    const res = await fetch(`${SYNC_API_URL}/api/songs/${remote.uuid}/file`, {
      headers: { 'X-Sync-Key': key },
    });
    if (!res.ok) throw new Error(`ダウンロード失敗: ${remote.name} (${res.status})`);
    const data = await res.arrayBuffer();
    const memos = deserializeMemosFromRemote(remote.memos);
    if (existingLocal) {
      Object.assign(existingLocal, {
        name: remote.name, bpm: remote.bpm, speed: remote.speed,
        data, fileName: remote.fileName, mimeType: remote.mimeType,
        memos, updatedAt: remote.updatedAt,
      });
      await dbPut(existingLocal);
    } else {
      await dbAdd({
        uuid: remote.uuid, name: remote.name, bpm: remote.bpm, speed: remote.speed,
        data, fileName: remote.fileName, mimeType: remote.mimeType, memos,
        createdAt: remote.createdAt, updatedAt: remote.updatedAt,
      });
    }
  }

  async function syncNow() {
    const key = getSyncKey();
    if (!key) return;

    const res = await fetch(`${SYNC_API_URL}/api/songs`, { headers: { 'X-Sync-Key': key } });
    if (res.status === 401) {
      localStorage.removeItem(SYNC_KEY_STORAGE);
      throw new Error('同期キーが正しくありません(再度お試しください)');
    }
    if (!res.ok) throw new Error(`サーバーエラー (${res.status})`);
    const remoteSongs = await res.json();
    const remoteByUuid = new Map(remoteSongs.map((s) => [s.uuid, s]));

    const localSongs = await dbGetAll();
    await Promise.all(localSongs.map(ensureSongUuid));
    const localByUuid = new Map(localSongs.map((s) => [s.uuid, s]));

    let uploaded = 0, downloaded = 0;

    for (const song of localSongs) {
      const remote = remoteByUuid.get(song.uuid);
      if (!remote || song.updatedAt > remote.updatedAt) {
        await uploadSong(key, song);
        uploaded++;
      }
    }
    for (const remote of remoteSongs) {
      const local = localByUuid.get(remote.uuid);
      if (!local || remote.updatedAt > local.updatedAt) {
        await downloadSong(key, remote, local);
        downloaded++;
      }
    }

    const setlistRes = await fetch(`${SYNC_API_URL}/api/setlists`, { headers: { 'X-Sync-Key': key } });
    if (!setlistRes.ok) throw new Error(`サーバーエラー(セットリスト) (${setlistRes.status})`);
    const remoteSetlists = await setlistRes.json();
    const remoteSetlistByUuid = new Map(remoteSetlists.map((s) => [s.uuid, s]));

    const localSetlists = await slGetAll();
    await Promise.all(localSetlists.map(ensureSetlistUuid));
    const localSetlistByUuid = new Map(localSetlists.map((s) => [s.uuid, s]));

    for (const sl of localSetlists) {
      const remote = remoteSetlistByUuid.get(sl.uuid);
      if (!remote || sl.updatedAt > remote.updatedAt) {
        await uploadSetlist(key, sl);
        uploaded++;
      }
    }
    for (const remote of remoteSetlists) {
      const local = localSetlistByUuid.get(remote.uuid);
      if (!local || remote.updatedAt > local.updatedAt) {
        await downloadSetlist(remote, local);
        downloaded++;
      }
    }

    alert(`同期完了: アップロード${uploaded}件 / ダウンロード${downloaded}件`);
    renderSongList();
    renderSetlistList();
  }

  async function uploadSetlist(key, setlist) {
    const res = await fetch(`${SYNC_API_URL}/api/setlists/${setlist.uuid}`, {
      method: 'PUT',
      headers: { 'X-Sync-Key': key, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: setlist.name,
        items: setlist.items || [],
        createdAt: setlist.createdAt,
        updatedAt: setlist.updatedAt,
      }),
    });
    if (!res.ok) throw new Error(`アップロード失敗(セットリスト): ${setlist.name} (${res.status})`);
  }

  async function downloadSetlist(remote, existingLocal) {
    if (existingLocal) {
      Object.assign(existingLocal, {
        name: remote.name, items: remote.items, updatedAt: remote.updatedAt,
      });
      await slPut(existingLocal);
    } else {
      await slAdd({
        uuid: remote.uuid, name: remote.name, items: remote.items,
        createdAt: remote.createdAt, updatedAt: remote.updatedAt,
      });
    }
  }

  // 曲の削除と同様、クラウド同期中ならサーバー側のセットリストも一緒に消す。
  async function deleteSetlistFromCloudIfSynced(setlist) {
    if (!setlist || !setlist.uuid) return;
    const key = localStorage.getItem(SYNC_KEY_STORAGE);
    if (!key) return;
    try {
      const res = await fetch(`${SYNC_API_URL}/api/setlists/${setlist.uuid}`, {
        method: 'DELETE', headers: { 'X-Sync-Key': key },
      });
      if (!res.ok && res.status !== 404) {
        alert(`サーバー側の削除に失敗しました(次回同期で復活する可能性があります): ${res.status}`);
      }
    } catch (err) {
      console.error(err);
      alert('サーバーに接続できず、クラウド側の削除はスキップされました(次回同期で復活する可能性があります)');
    }
  }

  btnSync.addEventListener('click', () => {
    syncNow().catch((err) => {
      console.error(err);
      alert('同期エラー: ' + (err && err.message ? err.message : err));
    });
  });

  // 他端末のセットアップ用に、同期キー入り(?key=...)のURLをコピーする。
  btnCopySetupLink.addEventListener('click', async () => {
    const key = localStorage.getItem(SYNC_KEY_STORAGE);
    if (!key) {
      alert('まだ同期キーが設定されていません。先に「クラウド同期」を1回実行してください。');
      return;
    }
    const url = `${location.origin}${location.pathname}?key=${encodeURIComponent(key)}`;
    try {
      await navigator.clipboard.writeText(url);
      alert('セットアップ用リンクをコピーしました。LINEやメモなどに貼り付けて、他の端末で開いてください。');
    } catch (err) {
      prompt('コピーしてください:', url);
    }
  });

  async function addNewSong(file) {
    if (!isPdfFile(file) && !isImageFile(file)) {
      alert('画像またはPDFファイルを選択してください');
      return;
    }
    const defaultName = file.name.replace(/\.[^.]+$/, '');
    const name = prompt('曲名を入力してください', defaultName);
    if (name === null) return; // キャンセル
    const bpmStr = prompt('BPM(任意、空欄可)', '');
    if (bpmStr === null) return;
    const bpm = bpmStr.trim() ? parseInt(bpmStr, 10) : null;

    const song = {
      uuid: crypto.randomUUID(),
      name: name.trim() || defaultName,
      data: await file.arrayBuffer(),
      mimeType: file.type || (isPdfFile(file) ? 'application/pdf' : 'image/png'),
      fileName: file.name,
      speed: DEFAULT_SPEED,
      bpm: Number.isFinite(bpm) ? bpm : null,
      memos: [],
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };
    const id = await dbAdd(song);
    song.id = id;
    activeSetlist = null;
    activeSetlistIndex = -1;
    viewerReturnScreen = songListScreen;
    viewer.classList.remove('setlist-active');
    await openSongRecord(song);
  }

  // 曲レコード(dbGetAllやfindSongByUuidで取得済みのもの)からビューアを開く共通処理。
  // セットリストの前後曲切替え(uuidから曲を探して開く)でも使う。
  async function openSongRecord(song) {
    viewer.classList.remove('setlist-memo-mode');
    song = await ensureSongUuid(song);
    currentSongId = song.id;
    speed = song.speed || DEFAULT_SPEED;
    currentMemos = song.memos || [];
    currentBpm = song.bpm ?? null;
    speedLabel.textContent = `${speed} px/s`;
    updateBpmLabel();
    const buf = await getSongArrayBuffer(song);
    const file = new File([buf], song.fileName, { type: song.mimeType });
    await loadIntoViewer(file);
  }

  async function openSong(id) {
    const song = await dbGet(id);
    if (!song) return;
    activeSetlist = null;
    activeSetlistIndex = -1;
    viewerReturnScreen = songListScreen;
    viewer.classList.remove('setlist-active');
    await openSongRecord(song);
  }

  btnAddSong.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (file) addNewSong(file);
  });
  songListScreen.addEventListener('dragover', (e) => e.preventDefault());
  songListScreen.addEventListener('drop', (e) => {
    e.preventDefault();
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) addNewSong(file);
  });

  btnBack.addEventListener('click', () => {
    flushSpeedSave();
    stopPlayback();
    stopMetronome();
    clearTiles();
    currentSourceKind = null;
    currentImageEl = null;
    currentPdfDoc = null;
    currentSongId = null;
    currentMemos = [];
    currentBpm = null;
    memoEditMode = false;
    pendingMemoType = null;
    pendingMemoPlacement = null;
    activeSetlist = null;
    activeSetlistIndex = -1;
    viewer.classList.remove('memo-edit-mode');
    viewer.classList.remove('setlist-active');
    viewer.classList.remove('setlist-memo-mode');
    showScreen(viewerReturnScreen || songListScreen);
    renderSongList();
    renderSetlistList();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushSpeedSave();
  });

  async function loadIntoViewer(file) {
    const isPdf = isPdfFile(file);
    // タイル生成時にscrollWrapのclientWidth/Heightを使うため、
    // 計測前にビューア画面を表示してレイアウトを確定させる(#viewerはdisplay:noneだと0になる)。
    showScreen(viewer);
    try {
      if (isPdf) await loadPdfFile(file);
      else await loadImageFile(file);
      if (contentHeight <= 0) {
        throw new Error('コンテンツの高さが0でした(読み込んだファイルが空か、非対応の形式の可能性があります)');
      }
      renderMemos();
    } catch (err) {
      console.error(err);
      alert('読み込みエラー: ' + (err && err.message ? err.message : err));
      showScreen(viewerReturnScreen || songListScreen);
    }
  }

  function loadImageFile(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        currentSourceKind = 'image';
        currentImageEl = img;
        currentPdfDoc = null;
        buildTilesFromImage(img).then(resolve);
        URL.revokeObjectURL(url);
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  let pdfJsLoadPromise = null;
  function loadPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if (pdfJsLoadPromise) return pdfJsLoadPromise;
    // プロトタイプ検証用にCDN(ESMビルド)から動的import。本実装ではリポジトリに同梱してオフライン化する。
    pdfJsLoadPromise = import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.1.200/pdf.min.mjs')
      .then((pdfjsLib) => {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.1.200/pdf.worker.min.mjs';
        window.pdfjsLib = pdfjsLib;
        return pdfjsLib;
      });
    return pdfJsLoadPromise;
  }

  async function loadPdfFile(file) {
    const pdfjsLib = await loadPdfJs();
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    currentSourceKind = 'pdf';
    currentPdfDoc = pdf;
    currentImageEl = null;
    await buildTilesFromPdf(pdf);
  }

  // ==================================================
  // リサイズ・向き変更で再タイル化
  // ==================================================
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (currentSourceKind) rebuildCurrentSource();
    }, 200);
  });

  renderSongList();
})();
</script>
